# Production-style stack for a single server: docker compose up -d --build
# Fill in .env first (see .env.example). Only Caddy publishes ports; the API and database stay internal.
name: tesda-track

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://tesda_track:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/tesda_track
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SKILLS_BRIDGE_MCP_ENABLED: ${SKILLS_BRIDGE_MCP_ENABLED:-true}
  SKILLS_BRIDGE_MCP_URL: ${SKILLS_BRIDGE_MCP_URL:-https://mcp.skills-bridge.ph/mcp}
  SKILLS_BRIDGE_MCP_TOKEN: ${SKILLS_BRIDGE_MCP_TOKEN:-}
  SKILLS_BRIDGE_TIMEOUT_SECONDS: ${SKILLS_BRIDGE_TIMEOUT_SECONDS:-10}

services:
  db:
    build: ./deploy/postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP check: during first-run initialization PostgreSQL only listens on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tesda_track"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    # Same image as the API (built once, by the api service below).
    image: tesda-track-backend:latest
    pull_policy: never
    # Embedding problems never block a deploy: search falls back to keywords until the next sync.
    command: ["sh", "-c", "alembic upgrade head && python -m tesda_track.seed && (python -m tesda_track.embeddings sync || echo 'WARNING: embeddings not synced')"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: tesda-track-backend:latest
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      # Only Caddy reaches this container; trust its X-Forwarded-For so the app sees each learner's address.
      FORWARDED_ALLOW_IPS: "*"
      # Road routes for Directions; set ROUTING_URL empty in .env to use Google Maps links instead.
      ROUTING_URL: ${ROUTING_URL-https://routing.openstreetmap.de/routed-car}
      # CARTO basemaps key for the center map; without it the map uses OpenStreetMap tiles.
      CARTO_API: ${CARTO_API-}
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
