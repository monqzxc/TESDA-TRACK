[server]
# Serves frontend/static/ at app/static/: the landing page's fonts and photos.
enableStaticServing = true

# Native widget theme, adapted from Streamlit's Fluent template.
# Local system fonts keep the application usable without a font CDN.
# Light and dark colors live in [theme.light] and [theme.dark]: the app follows the device's setting, and the menu
# at the top right offers System, Light and Dark. styles.css has the matching colors for the app's own elements.
[theme]
linkUnderline = true
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
font = "'Segoe UI', Arial, sans-serif"
headingFont = "'Segoe UI', Arial, sans-serif"
codeFont = "Consolas, monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["2.5rem", "1.75rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 700, 650, 600, 600, 600]
codeFontSize = "0.875rem"

# The landing page's faces, served from static/fonts/. They are declared here because a font face declared inside
# the landing page's shadow root doesn't load.
[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/BricolageGrotesque-latin.woff2"
weight = "200 800"

[[theme.fontFaces]]
family = "Figtree"
url = "app/static/fonts/Figtree-latin.woff2"
weight = "300 900"

[theme.sidebar]
headingFontSizes = ["1.75rem", "1.5rem", "1.25rem", "1.125rem", "1rem", "0.875rem"]

