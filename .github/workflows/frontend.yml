name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      # The API's schema, which frontend/src/api/schema.d.ts is generated from.
      - 'backend/tesda_track/**'
      - 'backend/requirements.txt'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      # The API's schema, which frontend/src/api/schema.d.ts is generated from.
      - 'backend/tesda_track/**'
      - 'backend/requirements.txt'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # Writing the schema needs no database or embedding model, so fastembed (onnxruntime) is left out.
      - name: Install the backend for the API schema
        run: grep -v '^fastembed==' ../backend/requirements.txt | pip install -r /dev/stdin
      - run: npm ci
      - run: npm run lint
      - name: Check the generated API types match the API
        run: npm run api:types -- --check
        env:
          PYTHON: python
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
