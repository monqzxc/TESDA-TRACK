name: Recommendation release checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            classic/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Configure disposable CI database
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=isolated-ci-secret-key-not-used-in-production-0123456789
          POSTGRES_PASSWORD=isolated-ci-postgres
          APP_DB_PASSWORD=isolated-ci-application
          DATABASE_URL=postgresql+psycopg://tesda_track:isolated-ci-application@127.0.0.1:5433/tesda_track
          TEST_DATABASE_URL=postgresql+psycopg://tesda_track:isolated-ci-application@127.0.0.1:5433/tesda_track_test
          SEMANTIC_SEARCH_ENABLED=false
          EOF
          docker compose -f docker-compose.dev.yml up -d --build
          for attempt in $(seq 1 60); do
            if docker compose -f docker-compose.dev.yml exec -T db pg_isready -h 127.0.0.1 -U postgres -d tesda_track; then
              break
            fi
            sleep 2
          done
          (cd backend && python -m alembic upgrade head)
      - name: Evaluate and enforce release gates
        # Pushes and pull requests fail on broken checks and show a pending expert review as a warning. Run the
        # workflow by hand (workflow_dispatch) before a release to enforce every gate, the review included.
        run: python scripts/release_check.py --skip-model --build-images ${{ github.event_name != 'workflow_dispatch' && '--review-warns' || '' }}
      - name: Upload sanitized evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-release-reports
          path: reports/*.json
          if-no-files-found: warn
      - name: Stop disposable database
        if: always()
        run: docker compose -f docker-compose.dev.yml down
