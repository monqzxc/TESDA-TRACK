name: Suggestion evaluation

# Profile-only suggestions (POST /api/v1/analysis/suggestions) against their baselines, with the public v6-colab
# model and only public, committed cases: no learner data and no secrets. Anyone can rerun it and get the same
# numbers. See docs/evaluation-and-release-checks.md#profile-only-suggestions.

on:
  workflow_dispatch:
  push:
    branches: [feat/tsp-webview-profile-suggestions]
    paths:
      - backend/evaluation/**
      - backend/tesda_track/services/analysis.py
      - backend/tesda_track/services/recommendation_service.py
      - backend/seed/qualifications.json
      - .github/workflows/suggestion-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Settings require these; the evaluation never connects to a database.
      DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:1/unused
      SECRET_KEY: ci-suggestion-evaluation-not-a-secret-0123456789abcdef
      ENVIRONMENT: test
      MODEL_REPO: Nyanta19/tesda-e5-small-v6-colab
      MODEL_DIR: models/tesda-e5-small-v6-colab
      # onnx/model.onnx as listed in the model repository's checksums.json on 2026-11-06.
      MODEL_SHA256: 0adef47feb648c7c1b902cf496ce4ceaf052de04784d155730b37b3127f489e1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependencies (huggingface_hub comes with fastembed)
        run: python -m pip install -r requirements.txt
      - name: Download and verify the model
        run: |
          python -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['MODEL_REPO'], local_dir=os.environ['MODEL_DIR'])"
          echo "$MODEL_SHA256  $MODEL_DIR/onnx/model.onnx" | sha256sum --check
          test ! -e "$MODEL_DIR/calibration.json" || echo "::notice::model has a calibration.json"
      - name: Evaluate with the model (as the API would serve it), with a calibration check
        continue-on-error: true
        run: python -m evaluation.suggestions --model-path "$MODEL_DIR" --calibrate --output ../reports/suggestion-evaluation.json
      - name: Evaluate without a model (keyword only)
        continue-on-error: true
        run: python -m evaluation.suggestions --no-model --output ../reports/suggestion-evaluation-keyword.json
      - name: Print the reports
        if: always()
        run: |
          for report in ../reports/suggestion-evaluation*.json; do
            echo "=== $report"; python -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(',', ':')))" "$report"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suggestion-evaluation
          path: reports/suggestion-evaluation*.json
          if-no-files-found: warn
