name: Suggestion evaluation

# Profile-only suggestions (POST /api/v1/analysis/suggestions) against their baselines, with the public v6-colab
# model and only public, committed cases: no learner data and no secrets. Anyone can rerun it and get the same
# numbers. See docs/evaluation-and-release-checks.md#profile-only-suggestions.

on:
  workflow_dispatch:
  push:
    branches: [feat/tsp-webview-profile-suggestions]
    paths:
      - backend/evaluation/**
      - backend/tesda_track/services/analysis.py
      - backend/tesda_track/services/recommendation_service.py
      - backend/seed/qualifications.json
      - .github/workflows/suggestion-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Settings require these; the evaluation never connects to a database.
      DATABASE_URL: postgresql+psycopg://unused:unused@127.0.0.1:1/unused
      SECRET_KEY: ci-suggestion-evaluation-not-a-secret-0123456789abcdef
      ENVIRONMENT: test
      MODEL_REPO: Nyanta19/tesda-e5-small-v6-colab
      MODEL_DIR: models/tesda-e5-small-v6-colab
      # onnx/model.onnx as listed in the model repository's checksums.json on 2026-11-06.
      MODEL_SHA256: 0adef47feb648c7c1b902cf496ce4ceaf052de04784d155730b37b3127f489e1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned dependencies (huggingface_hub comes with fastembed)
        run: python -m pip install -r requirements.txt
      - name: Download and verify the model
        run: |
          python -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['MODEL_REPO'], local_dir=os.environ['MODEL_DIR'])"
          echo "$MODEL_SHA256  $MODEL_DIR/onnx/model.onnx" | sha256sum --check
          test ! -e "$MODEL_DIR/calibration.json" || echo "::notice::model has a calibration.json"
      - name: Calibrate the model for goal matching, as a new model normally is (dev goals, rejection at least 0.9)
        continue-on-error: true
        run: python -m training.evaluate --model-path "$MODEL_DIR" --set dev --calibrate --min-rejection 0.9 --json ../reports/matching-calibration.json
      - name: Suggestions with the settings' defaults (what v6-colab gets today), plus a suggestion-tuned check
        continue-on-error: true
        run: python -m evaluation.suggestions --model-path "$MODEL_DIR" --calibrate --output ../reports/suggestion-evaluation.json
      - name: Suggestions with parameters tuned for suggestions (on the goal sets' tune half)
        continue-on-error: true
        run: |
          python -c "import json; r = json.load(open('../reports/suggestion-evaluation.json')); json.dump({'params': r['calibration_check']['tuned_params']}, open('../reports/suggestion-tuned-params.json', 'w'))"
          python -m evaluation.suggestions --model-path "$MODEL_DIR" --params-from ../reports/suggestion-tuned-params.json --params-source "tuned for suggestions on the goal sets' tune half (its goal_sets numbers include that half; adversarial is independent)" --output ../reports/suggestion-evaluation-tuned.json
      - name: Suggestions with matching's calibration (inherited)
        continue-on-error: true
        run: python -m evaluation.suggestions --model-path "$MODEL_DIR" --params-from ../reports/matching-calibration.json --params-source "v6-colab matching calibration (dev goals, min rejection 0.9)" --output ../reports/suggestion-evaluation-inherited.json
      - name: Suggestions without a model (keyword only)
        continue-on-error: true
        run: python -m evaluation.suggestions --no-model --output ../reports/suggestion-evaluation-keyword.json
      - name: Print the reports (in chunks; the log drops very long lines)
        if: always()
        run: |
          for report in ../reports/*.json; do
            python - "$report" <<'EOF'
          import json, sys
          name = sys.argv[1].rsplit("/", 1)[-1]
          text = json.dumps(json.load(open(sys.argv[1])), separators=(",", ":"), ensure_ascii=True)
          chunks = [text[i:i + 16000] for i in range(0, len(text), 16000)]
          for number, chunk in enumerate(chunks, 1):
              print(f"@@REPORT {name} {number}/{len(chunks)} {chunk}")
          EOF
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suggestion-evaluation
          path: reports/*.json
          if-no-files-found: warn
